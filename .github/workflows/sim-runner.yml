name: RISQ Sim Runner

on:
  push:
    branches:
      - add-ci-workflow
    paths-ignore:
      - 'backend/game/games/risq/sim/outputs/input/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/game/games/risq/sim
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref : add-ci-workflow

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true

      - name: Build simulator
        run: go build -o sim-runner .

      - name: Run configured simulation
        run: ./sim-runner -quiet input

      - name: Upload simulation outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risq-sim-output
          path: backend/game/games/risq/sim/outputs/input/
          if-no-files-found: warn

      - name: Publish simulation results back to branch
        if: always()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/game/games/risq/sim/outputs/input
          if ! git diff --cached --quiet --exit-code; then
            git commit -m "ci: publish RISQ simulation results"
            git push origin HEAD:add-ci-workflow
          fi
